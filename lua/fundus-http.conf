# =============================================================================
#  Fundus – http-Kontext Direktiven (Lua-Setup)
#  Wird nach /etc/nginx/conf.d/ bzw. openresty conf.d/ kopiert.
#  Diese Direktiven MUESSEN im http{}-Block stehen, nicht in server{}.
# =============================================================================

# Lua-Pakete aus dem App-Verzeichnis laden
lua_package_path "/opt/fundus/lua/?.lua;;";

# Hinweis: gzip und lua_code_cache werden bewusst NICHT hier gesetzt.
# - gzip ist bei nginx/OpenResty standardmäßig aktiv; ein zweites gzip_types
#   hier kollidiert mit der Haupt-nginx.conf und verhindert den Start.
# - lua_code_cache ist standardmäßig 'on' und eine location-Direktive.

# Shared Memory fuer Session-State und API-Caching
lua_shared_dict fundus_cache  10m;
lua_shared_dict fundus_sess   5m;

# Datei-Uploads (Bilder/Vollbilder → FileStore). Global im http-Kontext,
# damit Foto-Uploads nicht am 1-MB-Default scheitern (HTML-413 → JSON-Fehler).
client_max_body_size 512m;

# WebSocket-Upgrade-Map: setzt Connection: "upgrade" bei WS-Verbindungen
# (Messenger /api/v1/messenger/ws), sonst "close". Wird in den server-Blöcken
# als $connection_upgrade referenziert. MUSS im http-Kontext stehen.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Heimnetz-Erkennung (private Adressbereiche + lokal). Betreiber-Aktionen,
# Fernsteuerung, P2P-Tunnel und Proxy sind NUR von hier erreichbar – auch
# wenn der Pi per Port 443 im öffentlichen Netz hängt.
geo $fundus_lan {
    default         0;
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    ::1             1;
    fc00::/7        1;
    fe80::/10       1;
}

# Fernsteuerung (Cookie fundus_remote) NUR aus dem Heimnetz: Von außen gesetzt,
# hätte das Cookie die Passwortabfrage abgeschaltet und Anfragen durch den
# P2P-Tunnel an andere Pis geleitet.
map "$fundus_lan:$cookie_fundus_remote" $fundus_remote_ok {
    default                                0;
    "~^1:[1-9A-HJ-NP-Za-km-z]{40,64}$"     1;
}
