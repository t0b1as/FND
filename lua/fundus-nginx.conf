# =============================================================================
#  Fundus Marketplace – nginx/OpenResty server-Block (Port 80)
#  http-Kontext-Direktiven (lua_package_path, lua_shared_dict) liegen in
#  fundus-http.conf (wird nach conf.d/ kopiert).
# =============================================================================

server {
    listen 80;
    server_name _;

    set $api_base "http://127.0.0.1:3000";
    # SICHERHEIT: X-Fundus-Tunnel nur vom lokalen P2P-Tunnel-Handler (127.0.0.1)
    # durchreichen, von allen anderen Clients verwerfen. Vorher wurde er IMMER
    # geleert – dadurch sah die Go-API Tunnel-Anfragen fremder Peers als lokale
    # Betreiber-Zugriffe an.
    # Remote-Modus: lokale Admin-Passwortabfrage aus. /files, /settings, die
    # Admin-API und Betreiber-Aktionen gehen dann an den ENTFERNTEN Node
    # (app.lua bzw. rewrite_by_lua) – lokale Admin-Inhalte werden in diesem
    # Modus nie ausgeliefert. Bedingung identisch zu app.lua/rewrite_by_lua.
    set $fundus_admin_auth "Fundus Admin";
    if ($fundus_remote_ok = 1) {   # Fernsteuerung nur aus dem Heimnetz
        set $fundus_admin_auth off;
    }
    set $fundus_tunnel "";
    if ($remote_addr = "127.0.0.1") {
        set $fundus_tunnel $http_x_fundus_tunnel;
    }

    # Statische Assets
    location /static/ {
        alias /opt/fundus/lua/static/;
        # Langes Caching (30 Tage): Die CSS/JS-URL trägt die Revision als
        # Cache-Buster (?v=<rev>), daher holt der Browser nach einem Deploy
        # automatisch die neue Version — trotz langem Cache.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # PWA: Service Worker muss vom Root-Scope ausgeliefert werden, damit er die
    # ganze App kontrolliert (nicht nur /static/). Nie cachen — sonst bekommen
    # Nutzer SW-Updates nicht. Service-Worker-Allowed erlaubt den Root-Scope.
    location = /sw.js {
        alias /opt/fundus/lua/static/sw.js;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }
    location = /manifest.json {
        alias /opt/fundus/lua/static/manifest.json;
        default_type application/manifest+json;
    }

    # API-Proxy zur Go-Backend-API
    # Admin-Endpunkte: NUR aus dem lokalen Netz UND mit Basic-Auth (eigenes
    # Admin-Passwort, getrennt vom Linux-Account). Steht VOR /api/, damit nginx
    # sie zuerst matcht. IP-Range bei Bedarf anpassen (Standard: 10.10.11.0/24).
    location /api/v1/admin/ {
        rewrite_by_lua_block {
            local rp = (ngx.var.fundus_lan == "1") and ngx.var.cookie_fundus_remote or nil  -- Fernsteuerung nur aus dem Heimnetz
            if rp and #rp >= 40 and #rp <= 64 and rp:match("^[1-9A-HJ-NP-Za-km-z]+$") then
                local u = ngx.var.uri
                if not u:find("/api/v1/proxy/", 1, true) and not u:find("/api/v1/remote/", 1, true) then
                    ngx.req.set_uri("/api/v1/proxy/" .. rp .. u, false)
                end
            end
        }
        allow 10.10.11.0/24;
        # Setup-Hotspot (R634): Ohne Internet macht der Pi ein eigenes WLAN auf
        # und vergibt Adressen aus 10.42.0.0/24. Die Anmeldeseite des Handys
        # landet auf /settings#wifi – das war hier gesperrt und endete mit 403,
        # noch bevor nach dem Admin-Passwort gefragt wurde. Wer in diesem Netz
        # ist, steht ohnehin direkt am Gerät.
        allow 10.42.0.0/24;
        allow 127.0.0.1;
        deny  all;

        auth_basic           $fundus_admin_auth;
        auth_basic_user_file /etc/nginx/fundus-admin.htpasswd;

        # R661: Bei DATENABRUFEN kein Browser-Anmeldefenster. Fehlt das
        # Passwort, antwortet der Webserver mit 401 und einer Aufforderung –
        # der Browser zeigt daraufhin sein eigenes Fenster, auch wenn die
        # Abfrage nur im Hintergrund von der Startseite kam. Für Seiten bleibt
        # die Abfrage, für /api/ wird sie zu einem stillen 403.
        error_page 401 = @admin_kein_fenster;

        client_max_body_size 512m;
        proxy_pass         $api_base;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        # Sicherheit: externe Clients duerfen den Tunnel-Header NICHT setzen —
        # nur der echte P2P-Tunnel-Handler darf ihn intern setzen.
        proxy_set_header   X-Fundus-Tunnel $fundus_tunnel;
        proxy_set_header   X-Fundus-Owner $remote_user;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location = /api/v1/messenger/ws {
        # Remote-Modus: Messenger-WebSocket durch den Streaming-Tunnel.
        rewrite_by_lua_block {
            local rp = (ngx.var.fundus_lan == "1") and ngx.var.cookie_fundus_remote or nil  -- Fernsteuerung nur aus dem Heimnetz
            if rp and #rp >= 40 and #rp <= 64 and rp:match("^[1-9A-HJ-NP-Za-km-z]+$") then
                ngx.req.set_uri("/api/v1/proxy/" .. rp .. ngx.var.uri, false)
            end
        }
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Fundus-Tunnel $fundus_tunnel;
        proxy_set_header   X-Fundus-Owner "";
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Betreiber-Aktionen (Node-Wallet, Node-Seed, Blockproduktion, Gebühren):
    # Lesen frei, Schreiben nur mit Admin-Passwort (dasselbe wie /files).
    # X-Fundus-Owner trägt den per Basic-Auth GEPRÜFTEN Benutzer – die Go-API
    # wertet ihn nur für schreibende Methoden aus (dort ist Auth erzwungen).
    # Node-Seed (Seed-Wörter der Node-Wallet!): NUR aus dem Heimnetz und IMMER
    # mit Admin-Passwort – auch beim Lesen. Früher war GET ohne Passwort offen.
    location = /api/v1/files/node-seed {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;
        auth_basic           "Fundus Admin";
        auth_basic_user_file /etc/nginx/fundus-admin.htpasswd;
        proxy_pass         $api_base;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Fundus-Tunnel "";
        proxy_set_header   X-Fundus-Owner $remote_user;
    }

    location ~ ^/api/v1/(wallet/(payout|stake|unstake|mint)|chain/produce|grid/fee/|files/(node-seed|info/|share|unshare|reward-addr)) {
        rewrite_by_lua_block {
            -- Betreiber-Aktionen (Auszahlung, Staken, Freigaben …) NUR aus dem Heimnetz.
            -- Ausnahme: GET /api/v1/files/info/<hash> (Name/Typ/Größe) brauchen
            -- Bildbetrachter und Partnerbereich auch von außen – sonst laden
            -- dort keine Bilder.
            if ngx.var.fundus_lan ~= "1" then
                local m = ngx.req.get_method()
                if not ((m == "GET" or m == "HEAD") and ngx.var.uri:find("/api/v1/files/info/", 1, true) == 1) then
                    return ngx.exit(403)
                end
            end
            local rp = (ngx.var.fundus_lan == "1") and ngx.var.cookie_fundus_remote or nil  -- Fernsteuerung nur aus dem Heimnetz
            if rp and #rp >= 40 and #rp <= 64 and rp:match("^[1-9A-HJ-NP-Za-km-z]+$") then
                local u = ngx.var.uri
                if not u:find("/api/v1/proxy/", 1, true) and not u:find("/api/v1/remote/", 1, true) then
                    ngx.req.set_uri("/api/v1/proxy/" .. rp .. u, false)
                end
            end
        }
        limit_except GET HEAD {
            auth_basic           $fundus_admin_auth;
            auth_basic_user_file /etc/nginx/fundus-admin.htpasswd;
        }
        proxy_pass         $api_base;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Fundus-Tunnel $fundus_tunnel;
        proxy_set_header   X-Fundus-Owner $remote_user;
    }

    # ── WebDAV (R728) ────────────────────────────────────────────────────────
    # Diese Stelle FEHLTE: /dav/ landete bei "location /" und damit in der
    # Lua-Anwendung, die davon nichts weiß. Der Node sah die Anfrage nie –
    # deshalb stand auch nichts im Protokoll, und Windows meldete nur, die
    # Verbindung werde nicht angenommen.
    # R741: BEIDE Präfixe. /dav/ sind die eigenen Freigaben, /davr/ die fernen
    # über P2P. Getrennt, weil eine Route mit festem Bestandteil neben einer mit
    # Platzhalter kollidiert – siehe Node-Routen.
    #
    # Dass /davr/ hier mitmuss, ist derselbe Fallstrick wie in R728: Im Node
    # eingetragen, im Webserver vergessen, und von außen unerreichbar.
    location ~ ^/(dav|davr)/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Die Anmeldung MUSS durchgereicht werden, sonst fragt der Node
        # endlos nach Zugangsdaten, die er nie zu sehen bekommt.
        proxy_set_header   Authorization $http_authorization;
        proxy_pass_header  WWW-Authenticate;
        # WebDAV schickt Kopfzeilen, die ein gewöhnlicher Proxy verschluckt.
        proxy_set_header   Depth $http_depth;
        proxy_set_header   Destination $http_destination;
        proxy_set_header   Overwrite $http_overwrite;
        proxy_set_header   If $http_if;
        proxy_set_header   Timeout $http_timeout;
        proxy_set_header   Lock-Token $http_lock_token;
        # Office und der Explorer laden und speichern große Dateien am Stück.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        # Remote-Modus (Cookie fundus_remote=<PeerID>): alle API-Aufrufe der
        # Seite durch den P2P-Tunnel an den entfernten Node leiten – außer die
        # Proxy- und Remote-Steuerung selbst.
        rewrite_by_lua_block {
            -- P2P-Tunnel/Proxy und Fernsteuerung NUR aus dem Heimnetz.
            do
                local u0 = ngx.var.uri
                if ngx.var.fundus_lan ~= "1" and (u0:find("/api/v1/proxy/", 1, true) or u0:find("/api/v1/remote/", 1, true)) then
                    return ngx.exit(403)
                end
            end
            local rp = (ngx.var.fundus_lan == "1") and ngx.var.cookie_fundus_remote or nil  -- Fernsteuerung nur aus dem Heimnetz
            if rp and #rp >= 40 and #rp <= 64 and rp:match("^[1-9A-HJ-NP-Za-km-z]+$") then
                local u = ngx.var.uri
                if not u:find("/api/v1/proxy/", 1, true) and not u:find("/api/v1/remote/", 1, true) then
                    ngx.req.set_uri("/api/v1/proxy/" .. rp .. u, false)
                end
            end

            -- Lastverteilung (R672): ZULETZT, aus zwei Gründen.
            -- Erstens schreibt sie im Tunnelbetrieb die Adresse auf
            -- /api/v1/proxy/… um – stünde sie vor der Sperre oben, wiese die
            -- genau diese Anfragen von außen mit 403 ab, also die Besucher,
            -- für die die Verteilung gedacht ist.
            -- Zweitens behält die Fernsteuerung so Vorrang: Wer gezielt einen
            -- Node fernsteuert, soll nicht woandershin geschickt werden.
            if not rp then
                local okb, bal = pcall(require, "balance")
                if okb and bal then pcall(bal.route, ngx.var.uri) end
            end
        }
        # Datei-Uploads (Bilder/Vollbilder in den FileStore) brauchen ein
        # hohes Limit - der nginx-Default von 1 MB blockt Fotos sonst mit
        # einer HTML-413-Seite ("Unexpected token '<'" im JS-Upload).
        client_max_body_size 512m;
        proxy_pass         $api_base;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        # Sicherheit: externe Clients duerfen den Tunnel-Header NICHT setzen —
        # nur der echte P2P-Tunnel-Handler darf ihn intern setzen.
        proxy_set_header   X-Fundus-Tunnel $fundus_tunnel;
        proxy_set_header   X-Fundus-Owner "";
        proxy_set_header   X-Real-IP $remote_addr;
        # WebSocket-Upgrade (Messenger /api/v1/messenger/ws) durchreichen.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        # Grosse Datei-Downloads / Video-Streaming (wie in der SSL-Konfiguration):
        # proxy_read_timeout ist die maximale Pause ZWISCHEN zwei Backend-
        # Antworten – beim Nachladen von Chunks von entfernten Peers sonst
        # Abbruch mitten im Stream. Antwort nicht puffern: direkt durchreichen.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Sprachauswahl
    location = /lang {
        default_type text/html;
        content_by_lua_file /opt/fundus/lua/lang.lua;
    }

    # Nutzungsbedingungen akzeptieren
    location = /tos/accept {
        default_type text/html;
        content_by_lua_file /opt/fundus/lua/pages/tos_accept.lua;
    }

    # Lua-Router: alle anderen Requests
    # Admin-Seiten (Dateimanager, Einstellungen): wie in der SSL-Konfiguration
    # per Admin-Passwort geschützt. Fehlte auf Port 80 – der Dateimanager war
    # über http:// (und über den P2P-Tunnel, der Port 80 nutzt) frei erreichbar.
    location /files {
        allow 10.10.11.0/24;
        # Setup-Hotspot (R634): Ohne Internet macht der Pi ein eigenes WLAN auf
        # und vergibt Adressen aus 10.42.0.0/24. Die Anmeldeseite des Handys
        # landet auf /settings#wifi – das war hier gesperrt und endete mit 403,
        # noch bevor nach dem Admin-Passwort gefragt wurde. Wer in diesem Netz
        # ist, steht ohnehin direkt am Gerät.
        allow 10.42.0.0/24;
        allow 127.0.0.1;
        # R650: Von außen nur, wenn der Betreiber das ausdrücklich freigeschaltet
        # hat – über die Datei /opt/fundus/data/external-admin.enabled. Ohne sie
        # bleibt es wie bisher auf Heimnetz und Hotspot beschränkt. Umschaltbar
        # im laufenden Betrieb, ohne die Konfiguration zu ändern.
        access_by_lua_block {
            if ngx.var.fundus_lan ~= "1" then
                local f = io.open("/opt/fundus/data/external-admin.enabled", "r")
                if not f then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "text/html; charset=utf-8"
                    ngx.say("<h3>Nur aus dem Heimnetz</h3><p>Der Betreiberbereich ist von außen "
                        .. "gesperrt. Freischalten in den Einstellungen unter Sicherheit.</p>")
                    return ngx.exit(403)
                end
                f:close()
            end
        }
        auth_basic           $fundus_admin_auth;
        auth_basic_user_file /etc/nginx/fundus-admin.htpasswd;
        default_type text/html;
        content_by_lua_file /opt/fundus/lua/app.lua;
    }
    location /settings {
        allow 10.10.11.0/24;
        # Setup-Hotspot (R634): Ohne Internet macht der Pi ein eigenes WLAN auf
        # und vergibt Adressen aus 10.42.0.0/24. Die Anmeldeseite des Handys
        # landet auf /settings#wifi – das war hier gesperrt und endete mit 403,
        # noch bevor nach dem Admin-Passwort gefragt wurde. Wer in diesem Netz
        # ist, steht ohnehin direkt am Gerät.
        allow 10.42.0.0/24;
        allow 127.0.0.1;
        # R650: Von außen nur, wenn der Betreiber das ausdrücklich freigeschaltet
        # hat – über die Datei /opt/fundus/data/external-admin.enabled. Ohne sie
        # bleibt es wie bisher auf Heimnetz und Hotspot beschränkt. Umschaltbar
        # im laufenden Betrieb, ohne die Konfiguration zu ändern.
        access_by_lua_block {
            if ngx.var.fundus_lan ~= "1" then
                local f = io.open("/opt/fundus/data/external-admin.enabled", "r")
                if not f then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "text/html; charset=utf-8"
                    ngx.say("<h3>Nur aus dem Heimnetz</h3><p>Der Betreiberbereich ist von außen "
                        .. "gesperrt. Freischalten in den Einstellungen unter Sicherheit.</p>")
                    return ngx.exit(403)
                end
                f:close()
            end
        }
        auth_basic           $fundus_admin_auth;
        auth_basic_user_file /etc/nginx/fundus-admin.htpasswd;
        default_type text/html;
        content_by_lua_file /opt/fundus/lua/app.lua;
    }

    # Stille Abweisung für Datenabrufe im Betreiberbereich (R661).
    location @admin_kein_fenster {
        default_type application/json;
        return 403 '{"error":"Betreiberbereich: Admin-Passwort erforderlich","admin_required":true}';
    }

    # ── Setup-Hotspot "FUNDUS Rnnn": Anmeldeseiten-Erkennung der Handys ──────
    # Im Hotspot beantwortet der Pi ALLE DNS-Anfragen mit 10.42.0.1. Android,
    # iOS und Windows prüfen dann diese Adressen – die Umleitung öffnet auf dem
    # Handy automatisch die WLAN-Einstellungen des Nodes.
    location ~ ^/(generate_204|gen_204|hotspot-detect\.html|library/test/success\.html|connecttest\.txt|ncsi\.txt|redirect|canonical\.html|success\.txt)$ {
        return 302 http://10.42.0.1/settings#wifi;
    }

    location / {
        default_type text/html;
        content_by_lua_file /opt/fundus/lua/app.lua;
    }

    error_page 404 /static/404.html;
    error_page 500 502 503 504 /static/500.html;

    access_log /var/log/fundus/nginx-access.log;
    error_log  /var/log/fundus/nginx-error.log warn;
}
