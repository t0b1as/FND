# =============================================================================
#  Fundus Marketplace – HTTPS server-Block (Port 443, self-signed)
#  Wird vom Deploy NUR installiert wenn /etc/fundus/tls/fundus.crt existiert.
#  Loest das HTTPS-First-Verhalten mobiler Browser (Port 443).
# =============================================================================

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/fundus/tls/fundus.crt;
    ssl_certificate_key /etc/fundus/tls/fundus.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    set $api_base "http://127.0.0.1:3000";
    # SICHERHEIT: X-Fundus-Tunnel nur vom lokalen P2P-Tunnel-Handler (127.0.0.1)
    # durchreichen, von allen anderen Clients verwerfen. Vorher wurde er IMMER
    # geleert – dadurch sah die Go-API Tunnel-Anfragen fremder Peers als lokale
    # Betreiber-Zugriffe an.
    # Remote-Modus: lokale Admin-Passwortabfrage aus. /files, /settings, die
    # Admin-API und Betreiber-Aktionen gehen dann an den ENTFERNTEN Node
    # (app.lua bzw. rewrite_by_lua) – lokale Admin-Inhalte werden in diesem
    # Modus nie ausgeliefert. Bedingung identisch zu app.lua/rewrite_by_lua.
    set $fundus_admin_auth "Fundus Admin";
    if ($cookie_fundus_remote ~ "^[1-9A-HJ-NP-Za-km-z]{40,64}$") {
        set $fundus_admin_auth off;
    }
    set $fundus_tunnel "";
    if ($remote_addr = "127.0.0.1") {
        set $fundus_tunnel $http_x_fundus_tunnel;
    }

    location /static/ {
        alias /opt/fundus/lua/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # PWA: Service Worker muss vom Root-Scope ausgeliefert werden, damit er die
    # ganze App kontrolliert (nicht nur /static/). Nie cachen — sonst bekommen
    # Nutzer SW-Updates nicht. Service-Worker-Allowed erlaubt den Root-Scope.
    location = /sw.js {
        alias /opt/fundus/lua/static/sw.js;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }
    # Manifest im Root-Scope bequem erreichbar (funktioniert auch unter /static/).
    location = /manifest.json {
        alias /opt/fundus/lua/static/manifest.json;
        default_type application/manifest+json;
    }

    # Admin-Endpunkte: NUR aus dem lokalen Netz UND mit Basic-Auth (eigenes
    # Admin-Passwort, getrennt vom Linux-Account). Diese Location steht VOR der
    # allgemeinen /api/-Location, damit nginx sie zuerst matcht.
    # IP-Range bei Bedarf anpassen (Standard: Pi-Subnetz 10.10.11.0/24).
    location /api/v1/admin/ {
        rewrite_by_lua_block {
            local rp = ngx.var.cookie_fundus_remote
            if rp and #rp >= 40 and #rp <= 64 and rp:match("^[1-9A-HJ-NP-Za-km-z]+$") then
                local u = ngx.var.uri
                if not u:find("/api/v1/proxy/", 1, true) and not u:find("/api/v1/remote/", 1, true) then
                    ngx.req.set_uri("/api/v1/proxy/" .. rp .. u, false)
                end
            end
        }
        allow 10.10.11.0/24;
        allow 127.0.0.1;
        deny  all;

        auth_basic           $fundus_admin_auth;
        auth_basic_user_file /etc/nginx/fundus-admin.htpasswd;

        client_max_body_size 512m;
        # Literaler proxy_pass (KEINE Variable): Mit Variable verlangt nginx
        # einen resolver und kann sonst zur Laufzeit 500 werfen. Die admin-
        # Location braucht keine dynamische Auflösung — fester Upstream.
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        # Sicherheit: externe Clients duerfen den Tunnel-Header NICHT setzen —
        # nur der echte P2P-Tunnel-Handler darf ihn intern setzen.
        proxy_set_header   X-Fundus-Tunnel $fundus_tunnel;
        proxy_set_header   X-Fundus-Owner $remote_user;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Connection "";
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Dedizierte WebSocket-Location (Messenger). MUSS vor /api/ stehen, damit
    # nginx sie zuerst matcht. Literaler proxy_pass (keine Variable) — variabler
    # proxy_pass verträgt sich schlecht mit dem WS-Upgrade. Lange Timeouts, damit
    # die Verbindung offen bleibt.
    location = /api/v1/messenger/ws {
        # Remote-Modus: Messenger-WebSocket durch den Streaming-Tunnel.
        rewrite_by_lua_block {
            local rp = ngx.var.cookie_fundus_remote
            if rp and #rp >= 40 and #rp <= 64 and rp:match("^[1-9A-HJ-NP-Za-km-z]+$") then
                ngx.req.set_uri("/api/v1/proxy/" .. rp .. ngx.var.uri, false)
            end
        }
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Fundus-Tunnel $fundus_tunnel;
        proxy_set_header   X-Fundus-Owner "";
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Betreiber-Aktionen (Node-Wallet, Node-Seed, Blockproduktion, Gebühren):
    # Lesen frei, Schreiben nur mit Admin-Passwort (dasselbe wie /files).
    # X-Fundus-Owner trägt den per Basic-Auth GEPRÜFTEN Benutzer – die Go-API
    # wertet ihn nur für schreibende Methoden aus (dort ist Auth erzwungen).
    location ~ ^/api/v1/(wallet/(payout|stake|unstake|mint)|chain/produce|grid/fee/|files/(node-seed|info/|share|unshare|reward-addr)) {
        rewrite_by_lua_block {
            local rp = ngx.var.cookie_fundus_remote
            if rp and #rp >= 40 and #rp <= 64 and rp:match("^[1-9A-HJ-NP-Za-km-z]+$") then
                local u = ngx.var.uri
                if not u:find("/api/v1/proxy/", 1, true) and not u:find("/api/v1/remote/", 1, true) then
                    ngx.req.set_uri("/api/v1/proxy/" .. rp .. u, false)
                end
            end
        }
        limit_except GET HEAD {
            auth_basic           $fundus_admin_auth;
            auth_basic_user_file /etc/nginx/fundus-admin.htpasswd;
        }
        proxy_pass         $api_base;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Fundus-Tunnel $fundus_tunnel;
        proxy_set_header   X-Fundus-Owner $remote_user;
    }

    location /api/ {
        # Remote-Modus (Cookie fundus_remote=<PeerID>): alle API-Aufrufe der
        # Seite durch den P2P-Tunnel an den entfernten Node leiten – außer die
        # Proxy- und Remote-Steuerung selbst.
        rewrite_by_lua_block {
            local rp = ngx.var.cookie_fundus_remote
            if rp and #rp >= 40 and #rp <= 64 and rp:match("^[1-9A-HJ-NP-Za-km-z]+$") then
                local u = ngx.var.uri
                if not u:find("/api/v1/proxy/", 1, true) and not u:find("/api/v1/remote/", 1, true) then
                    ngx.req.set_uri("/api/v1/proxy/" .. rp .. u, false)
                end
            end
        }
        client_max_body_size 512m;
        proxy_pass         $api_base;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        # Sicherheit: externe Clients duerfen den Tunnel-Header NICHT setzen —
        # nur der echte P2P-Tunnel-Handler darf ihn intern setzen.
        proxy_set_header   X-Fundus-Tunnel $fundus_tunnel;
        proxy_set_header   X-Fundus-Owner "";
        proxy_set_header   X-Real-IP $remote_addr;
        # WebSocket-Upgrade (Messenger /api/v1/messenger/ws) durchreichen.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        # Grosse Datei-Downloads koennen lange dauern (Chunks werden ggf. erst
        # von Remote-Peers geholt). proxy_read_timeout ist die maximale Pause
        # ZWISCHEN zwei Backend-Antworten — bei langsamem Chunk-Fetch sonst
        # Verbindungsabbruch mitten im Stream. Grosszuegig auf 1h gesetzt.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Antwort NICHT puffern: Datei-Stream direkt durchreichen, damit der
        # Browser sofort Fortschritt sieht und nginx nicht erst alles sammelt.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /lang {
        default_type text/html;
        content_by_lua_file /opt/fundus/lua/lang.lua;
    }

    location = /tos/accept {
        default_type text/html;
        content_by_lua_file /opt/fundus/lua/pages/tos_accept.lua;
    }

    # Admin-Seiten (Freigaben verwalten, Einstellungen): durch Basic Auth
    # geschützt — derselbe -AdminPass wie die Admin-API. Der Browser fragt
    # einmal nach admin/Passwort. MUSS vor "location /" stehen.
    location /files {
        allow 10.10.11.0/24;
        allow 127.0.0.1;
        deny  all;
        auth_basic           $fundus_admin_auth;
        auth_basic_user_file /etc/nginx/fundus-admin.htpasswd;
        default_type text/html;
        content_by_lua_file /opt/fundus/lua/app.lua;
    }
    location /settings {
        allow 10.10.11.0/24;
        allow 127.0.0.1;
        deny  all;
        auth_basic           $fundus_admin_auth;
        auth_basic_user_file /etc/nginx/fundus-admin.htpasswd;
        default_type text/html;
        content_by_lua_file /opt/fundus/lua/app.lua;
    }

    location / {
        default_type text/html;
        content_by_lua_file /opt/fundus/lua/app.lua;
    }

    error_page 404 /static/404.html;
    error_page 500 502 503 504 /static/500.html;

    access_log /var/log/fundus/nginx-access.log;
    error_log  /var/log/fundus/nginx-error.log warn;
}
